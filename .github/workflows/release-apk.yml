name: Build & attach AU75 APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag / version (e.g. v1.4.0)"
        required: true
        default: v1.4.0
      prerelease:
        description: "Mark release as pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build web export
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Rename APK with release tag
        run: |
          echo "TAG=${{ github.event.inputs.tag }}" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/debug/app-debug.apk "AU75-${{ github.event.inputs.tag }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: "AU75 ${{ github.event.inputs.tag }}"
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
          files: AU75-${{ github.event.inputs.tag }}.apk